# Dracut configuration for PHOENIX initramfs
# Used by mkosi to build UKI images

# Add PHOENIX custom modules (two-world: initramfs hooks)
add_dracutmodules+=" phoenix-devices phoenix-writeblock "

# Standard modules needed for live OS
add_dracutmodules+=" dmsquash-live dm crypt crypt-gpg crypt-luks "

# Network modules (for streaming mode)
add_dracutmodules+=" network network-manager "

# FIDO2 support (no TPM2 — portable media rule)
add_dracutmodules+=" fido2 "

# Compression
compress="zstd -9"

# Omit drivers to keep initramfs small
omit_drivers+=" nouveau radeon i915 "

# Hostonly — build for target hardware
hostonly="no"
hostonly_cmdline="no"

# Include phoenix-common.sh (single source of truth)
install_items+=" /usr/lib/phoenix/common.sh "
install_items+=" /etc/phoenix/target-list "
